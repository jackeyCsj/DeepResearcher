services:
  postgres:
    image: postgres:17-alpine
    container_name: deep-research-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csj}
      POSTGRES_DB: ${POSTGRES_DB:-deep_research}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - deep_research_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csj} -d ${POSTGRES_DB:-deep_research}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deep_research_postgres_data:
